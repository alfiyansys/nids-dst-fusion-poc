[project]
name = "nids-dst-fusion-poc"
version = "0.1.0"
description = "Dempster-Shafer Theory sensor fusion for multi-engine NIDS alert correlation (PoC + supporting notebooks for the accompanying paper)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
